appId: com.pedroemmanuelbuerger.moviechooser
productName: MovieChooser
copyright: Copyright © PedroEmmanuelBuerger
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
extraResources:
  - from: build/icon.ico
    to: icon.ico
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MovieChooser
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
extraMetadata:
  name: MovieChooser
